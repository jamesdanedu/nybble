# Nybble — Supabase project config.
# `supabase init` will generate a much longer file than this; the block that
# matters for us is [functions.score].

project_id = "nybble"

[functions.score]
# JWT verification OFF. Supabase's own advice under the toggle says the same:
# "Recommended: OFF with JWT and custom auth logic in your function code", which
# is exactly what this is.
#
# Nothing is given up. The gateway was never what protected the answer keys —
# index.ts authorises every caller itself and always did:
#
#   * it reads the bearer token with auth.getUser(), which revalidates against
#     the auth server rather than trusting the cookie
#   * it refuses a request whose attempt does not belong to that user (403)
#   * it refuses an attempt that is not in_progress (409)
#   * activity_keys has RLS on with NO policies, so the keys are readable only
#     by the service role, which lives in this function and nowhere else
#
# A tokenless caller gets 401 from our own code, one layer later, with CORS
# headers attached so the browser can actually read the refusal. Leaving
# verification ON would also refuse the browser's CORS preflight, which carries
# no Authorization header by design — the refusal would arrive with no
# Access-Control-Allow-Origin and the POST would never be sent.
#
# For the record, since a commit message here once claimed otherwise: that
# preflight problem was NOT what broke submissions on the live deployment. The
# toggle was already off there. The real cause was index.ts being pasted alone
# into the dashboard editor, where its relative imports cannot resolve — see the
# warning at the top of that file.
verify_jwt = false
